name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyinstaller pyside6
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name FOX_SCOUT_PRO --icon assets/icon.ico fox_scout_pro.py
      - uses: actions/upload-artifact@v4
        with:
          name: FOX_SCOUT_PRO-windows
          path: dist/FOX_SCOUT_PRO.exe
